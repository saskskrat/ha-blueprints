# Version 2: big, colourful full-width tiles. Add these as cards in a section,
# for example right under the heading card. Each tile shows itself only while
# its season sensor is on, so the dashboard stays quiet the rest of the year.
# `hide_state` and `state_content: []` hide the "last activated" time under the name.
# Needs: Home Assistant 2026.5+ (tile card with visibility). No HACS cards.
- type: tile
  entity: scene.halloween
  name: "🎃 Halloween is here! Tap to spook up the lights"
  icon: mdi:halloween
  color: orange
  vertical: false
  hide_state: true
  state_content: []
  tap_action:
    action: perform-action
    perform_action: scene.turn_on
    target:
      entity_id: scene.halloween
  icon_tap_action:
    action: perform-action
    perform_action: scene.turn_on
    target:
      entity_id: scene.halloween
  grid_options:
    columns: full
  visibility:
    - condition: state
      entity: binary_sensor.halloween_season
      state: "on"

