# Version 1: compact badges. Add each one under a heading card's `badges:` list.
# Each badge shows itself only while its season sensor is on.
# Needs: Home Assistant 2026.5+ (button badge with visibility). No HACS cards.
- type: button
  icon: mdi:halloween
  text: Halloween
  visibility:
    - condition: state
      entity: binary_sensor.halloween_season
      state: "on"
  tap_action:
    action: perform-action
    perform_action: scene.turn_on
    target:
      entity_id: scene.halloween

