- id: climate_away_setback_example
  alias: "Climate: setback when away"
  trigger:
    - platform: state
      entity_id: person.example_person
      to: "not_home"
  condition:
    - condition: state
      entity_id: person.example_person
      state: "not_home"
  action:
    - service: climate.set_temperature
      target:
        entity_id: climate.example_thermostat
      data:
        temperature: 62
  mode: single
