- id: security_door_left_open_alert
  alias: "Security: door left open"
  trigger:
    - platform: state
      entity_id: binary_sensor.example_door
      to: "on"
      for:
        minutes: 5
  condition: []
  action:
    - service: notify.example_mobile_app
      data:
        title: "Door left open"
        message: "{{ trigger.to_state.attributes.friendly_name }} has been open for 5+ minutes."
  mode: single
