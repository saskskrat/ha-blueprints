# Turn on an entry light and send a notification when a tracked person
# transitions to "home", but only after dark (so it doesn't fire during the day).
- id: presence_someone_arrives_home
  alias: "Presence: someone arrives home"
  description: >
    Adapt `person.example_person` and `light.example_entry` to your own
    entities. Add more `entity_id` values under trigger to cover multiple people.
  trigger:
    - platform: state
      entity_id:
        - person.example_person
      to: "home"
  condition:
    - condition: sun
      after: sunset
      before: sunrise
  action:
    - service: light.turn_on
      target:
        entity_id: light.example_entry
    - service: notify.example_mobile_app
      data:
        message: "{{ trigger.to_state.attributes.friendly_name }} is home."
  mode: single
