# Alert when a normally-available entity goes "unavailable" for a while —
# usually means a dropped Wi-Fi/cloud connection worth checking on.
- id: notifications_device_unavailable_alert
  alias: "Notify: device unavailable"
  trigger:
    - platform: state
      entity_id: light.example_room
      to: "unavailable"
      for:
        minutes: 15
  condition: []
  action:
    - service: notify.example_mobile_app
      data:
        title: "Device offline"
        message: >-
          {{ trigger.to_state.attributes.friendly_name }} has been
          unavailable for 15+ minutes.
  mode: single
